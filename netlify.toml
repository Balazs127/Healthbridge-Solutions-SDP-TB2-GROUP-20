[[headers]]
  for = "/*"
  [headers.values]
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors https://balazskis.com https://www.balazskis.com https://personalsitebk.netlify.app; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), fullscreen=(self)"